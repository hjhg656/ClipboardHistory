# 在 GitHub 的免费 macOS 机器上编译出未签名的 IPA
# 不需要你有 Mac，也不需要苹果付费账号。
# 编出来的 IPA 是未签名的，装到手机上要再用 AltStore（免费）签名一次，见 README 的“没有 Mac 怎么办”。
name: Build IPA

on:
  workflow_dispatch:  # 在仓库的 Actions 页面手动点 Run workflow

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 看一眼 Xcode 版本
        run: xcodebuild -version

      - name: 编译（不签名）
        run: |
          xcodebuild \
            -project ClipboardHistory.xcodeproj \
            -scheme ClipboardHistory \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY=""

      - name: 打包成 IPA
        run: |
          APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -n 1)
          echo "APP_PATH=$APP_PATH"
          ls -lh "$APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r ClipboardHistory-unsigned.ipa Payload

      - name: 上传 IPA
        uses: actions/upload-artifact@v4
        with:
          name: ClipboardHistory-unsigned-ipa
          path: ClipboardHistory-unsigned.ipa
          if-no-files-found: error
